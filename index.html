<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Web Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <main class ="calculator">
    <header
class="calculator-header">
<h1>Calculator</h1>
<p>Modern Calculator</p>
    </header>
    <section class="display"aria-label="Calculator display">
<div
class="previous-value">0</div>
<div
class="current-value">0</div>
    </section>
<section class="keypad"aria-label="Calculator keypad">
    <button class="key utility">AC</button>
    <button class="key utility">+/-</button>
    <button class="key utility">%</button>
    <button class="key operator">/</button>
    <button class="key">7</button>
    <button class="key">8</button>
    <button class="key">9</button>
    <button class="key operator">*</button>
    <button class="key">4</button>
    <button class="key">5</button>
    <button class="key">6</button>
    <button class="key operator">-</button>
    <button class="key">1</button>
    <button class="key">2</button>
    <button class="key">3</button>
    <button class="key operator">+</button>
    <button class="key zero">0</button>
    <button class="key equals">=</button>
</section>
    <footer>
        class="calculated-footer">
        <span>Modern Web Calculator</span>
    </footer>
</main>
</body>
</html>
